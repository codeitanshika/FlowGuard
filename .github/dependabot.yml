# Automated dependency-update PRs. Every one runs the full CI gate, so a
# bump that breaks lint, tests, the security scans or the images is caught
# before merge — this is the routine half of "keep dependencies patched"
# (pip-audit in CI is the reactive half: it fails on a known-vulnerable one).
version: 2

updates:
  # Python runtime dependencies: one manifest per service and per agent, plus
  # the aggregated dev requirements and the pinned CI tooling.
  - package-ecosystem: pip
    directories:
      - "/services/*"
      - "/agents/*"
    schedule:
      interval: weekly
    groups:
      python-runtime:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    groups:
      python-dev:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: "/infra/ci"
    schedule:
      interval: weekly

  # Base images (python:3.12-slim) in every Dockerfile.
  - package-ecosystem: docker
    directories:
      - "/services/*"
      - "/agents/*"
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly

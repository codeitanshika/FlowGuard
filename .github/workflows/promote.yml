name: Promote to production

# Triggered by pushing a version tag (git tag v1.2.3 && git push origin v1.2.3).
# Promotion never rebuilds: it re-tags the images CI already built, scanned,
# and verified in staging for this exact commit (docs/decisions/ADR-0019).
#
# The `production` environment must be configured in the repository settings
# with required reviewers — that manual approval is the gate. Without it this
# job would run unattended, so the setup guide lists it as a required step.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  promote:
    name: Promote ${{ matrix.image }}
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image:
          - gateway
          - payment
          - fraud
          - user
          - notification
          - monitor
          - healer
          - ops-controller
          - fraud-agent
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Registry namespace (GHCR requires lowercase)
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - name: Refuse to promote a commit that never passed CI
        # An image tagged sha-<commit> exists only if CI's publish job ran for
        # that commit, which requires every gate to have passed. If the tag
        # points at a commit that was never built on main, stop here.
        run: |
          docker buildx imagetools inspect \
            "ghcr.io/${OWNER}/flowguard-${{ matrix.image }}:sha-${GITHUB_SHA}" > /dev/null \
            || { echo "::error::no CI-built image for ${GITHUB_SHA}; tag a commit that passed CI on main"; exit 1; }
      - name: Re-tag the verified image as the release and as production
        run: |
          SRC="ghcr.io/${OWNER}/flowguard-${{ matrix.image }}:sha-${GITHUB_SHA}"
          docker buildx imagetools create \
            --tag "ghcr.io/${OWNER}/flowguard-${{ matrix.image }}:${GITHUB_REF_NAME}" \
            --tag "ghcr.io/${OWNER}/flowguard-${{ matrix.image }}:production" \
            "${SRC}"

  deploy:
    name: Deploy to the VM
    needs: promote
    runs-on: ubuntu-latest
    # No `environment:` here on purpose: approval is already required once, on
    # `promote`. If DEPLOY_HOST isn't configured yet (no VM provisioned —
    # see ADR-0020, infra/terraform/ was deliberately never applied), this
    # job says so plainly and stops rather than failing confusingly on a
    # missing secret deep inside deploy.sh.
    steps:
      - uses: actions/checkout@v4
      - name: Check a deploy target is configured
        id: target
        run: |
          if [ -z "${{ secrets.DEPLOY_HOST }}" ]; then
            echo "::notice::DEPLOY_HOST isn't set — no VM has been provisioned yet (infra/terraform/ was never applied, see ADR-0020). Images are promoted to :production and :${GITHUB_REF_NAME}; apply the Terraform yourself and configure the deploy secrets (see the setup guide) to enable this step."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Registry namespace (GHCR requires lowercase)
        if: steps.target.outputs.configured == 'true'
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - name: Deploy this release to the VM
        if: steps.target.outputs.configured == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST_KEY: ${{ secrets.DEPLOY_HOST_KEY }}
          PRODUCTION_ENV_FILE: ${{ secrets.PRODUCTION_ENV_FILE }}
        run: |
          export IMAGE_REGISTRY="ghcr.io/${OWNER}"
          DOMAIN_NAME=$(sed -n "s/^DOMAIN_NAME=//p" <<<"$PRODUCTION_ENV_FILE" | tr -d \''"')
          infra/scripts/deploy.sh "${GITHUB_REF_NAME}" "${DOMAIN_NAME:?DOMAIN_NAME missing from PRODUCTION_ENV_FILE}"

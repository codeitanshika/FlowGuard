name: CI

# Every pull request and every push to main runs the full gate below. On a
# push to main that passes, the same run publishes the images and verifies
# them in "staging" (see the publish and staging jobs, and
# docs/decisions/ADR-0019-cicd-build-once-promote-the-artifact.md).

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # A newer push to the same PR/branch supersedes a run still in flight.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Pinned: see the comment in docs/deployment/setup-guide.md on why.
  TRIVY_IMAGE: aquasec/trivy:0.74.0
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: infra/ci/requirements-tools.txt
      - run: pip install -r infra/ci/requirements-tools.txt
      - name: ruff check
        run: ruff check . --output-format=github
      - name: ruff format --check
        run: ruff format --check .

  unit-tests:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.12 is what every Dockerfile runs; 3.13 is what local development
        # uses — both must stay green.
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Unit tests (repo root)
        run: python -m pytest -q
      - name: Payment service tests (own pytest run — see ADR-0017)
        working-directory: services/payment
        run: python -m pytest -q

  security:
    name: Security scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans the whole history, not just the tip
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: infra/ci/requirements-tools.txt
      - run: pip install -r infra/ci/requirements-tools.txt
      - name: bandit (static analysis of application code)
        run: bandit -r agents services shared infra -x "*/tests/*" -q
      - name: pip-audit (known vulnerabilities in what the images install)
        run: python infra/ci/audit_dependencies.py
      - name: gitleaks (secrets anywhere in git history)
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks detect --source . --no-banner --redact -v

  images:
    name: Build and scan ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: gateway, dockerfile: services/gateway/Dockerfile }
          - { image: payment, dockerfile: services/payment/Dockerfile }
          - { image: fraud, dockerfile: services/fraud/Dockerfile }
          - { image: user, dockerfile: services/user/Dockerfile }
          - { image: notification, dockerfile: services/notification/Dockerfile }
          - { image: monitor, dockerfile: agents/monitor/Dockerfile }
          - { image: healer, dockerfile: agents/healer/Dockerfile }
          - { image: ops-controller, dockerfile: agents/ops_controller/Dockerfile }
          - { image: fraud-agent, dockerfile: agents/fraud/Dockerfile }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          load: true
          tags: flowguard-${{ matrix.image }}:ci
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
      - name: Trivy (fixable HIGH/CRITICAL vulnerabilities fail the build)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "${TRIVY_IMAGE}" image \
            --severity HIGH,CRITICAL --ignore-unfixed --scanners vuln --exit-code 1 \
            flowguard-${{ matrix.image }}:ci

  integration:
    name: Integration tests (full stack)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Configure the stack from .env.example (local-dev values only, no real secrets)
        run: cp .env.example .env
      - name: Start the stack and wait until every service is healthy
        run: docker compose up --build -d --wait --wait-timeout 300
      - name: Integration tests
        run: python -m pytest tests/integration -v
      - name: Collect service logs
        if: failure()
        run: docker compose logs --no-color > compose-logs.txt
      - name: Upload service logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-compose-logs
          path: compose-logs.txt
      - name: Tear down
        if: always()
        run: docker compose down -v

  publish:
    name: Publish images to GHCR
    # Only a push to main, and only once every gate above has passed — an
    # image existing in the registry means its commit passed CI.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, unit-tests, security, images, integration]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: gateway, dockerfile: services/gateway/Dockerfile }
          - { image: payment, dockerfile: services/payment/Dockerfile }
          - { image: fraud, dockerfile: services/fraud/Dockerfile }
          - { image: user, dockerfile: services/user/Dockerfile }
          - { image: notification, dockerfile: services/notification/Dockerfile }
          - { image: monitor, dockerfile: agents/monitor/Dockerfile }
          - { image: healer, dockerfile: agents/healer/Dockerfile }
          - { image: ops-controller, dockerfile: agents/ops_controller/Dockerfile }
          - { image: fraud-agent, dockerfile: agents/fraud/Dockerfile }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Registry namespace (GHCR requires lowercase)
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - name: Build and push (layers come from the cache the scan job just filled)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          # The immutable tag is the commit; that exact artifact is what gets
          # verified in staging and later promoted — never rebuilt.
          tags: |
            ghcr.io/${{ env.OWNER }}/flowguard-${{ matrix.image }}:sha-${{ github.sha }}
            ghcr.io/${{ env.OWNER }}/flowguard-${{ matrix.image }}:main
          cache-from: type=gha,scope=${{ matrix.image }}

  staging:
    name: Staging verification (registry images)
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: staging
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Configure the stack
        run: |
          cp .env.example .env
          echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - name: Start the stack from the published images (no build)
        env:
          IMAGE_TAG: sha-${{ github.sha }}
        run: |
          export IMAGE_REGISTRY="ghcr.io/${OWNER}"
          docker compose -f docker-compose.yml -f infra/docker/docker-compose.images.yml \
            up -d --no-build --wait --wait-timeout 300
      - name: Integration tests against the published artifacts
        run: python -m pytest tests/integration -v
      - name: Collect service logs
        if: failure()
        env:
          IMAGE_TAG: sha-${{ github.sha }}
        run: |
          export IMAGE_REGISTRY="ghcr.io/${OWNER}"
          docker compose -f docker-compose.yml -f infra/docker/docker-compose.images.yml logs --no-color > compose-logs.txt
      - name: Upload service logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: staging-compose-logs
          path: compose-logs.txt
      - name: Tear down
        if: always()
        env:
          IMAGE_TAG: sha-${{ github.sha }}
        run: |
          export IMAGE_REGISTRY="ghcr.io/${OWNER}"
          docker compose -f docker-compose.yml -f infra/docker/docker-compose.images.yml down -v

name: Rollback production

# Manual only — a rollback is a deliberate operator decision, never
# automatic. Re-deploys an already-published, already-verified image tag
# using the exact same script promote.yml's deploy job uses
# (infra/scripts/deploy.sh) — never a rebuild, same "build once, promote
# the artifact" reasoning as ADR-0019. Pick any tag that previously made
# it through promote.yml: a release tag (v1.2.2), or `production`'s own
# prior state if you tagged it before the release you're reverting (a
# plain :production re-push has no history of its own — see the setup
# guide's rollback runbook for keeping track of what to roll back to).

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Tag to roll back to, e.g. v1.2.2 (must already exist in the registry — this never builds)"
        required: true

permissions:
  contents: read

jobs:
  rollback:
    name: Roll back to ${{ inputs.image_tag }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Registry namespace (GHCR requires lowercase)
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - name: Refuse to roll back to a tag that was never published
        run: |
          for image in gateway payment fraud user notification monitor healer ops-controller fraud-agent; do
            docker buildx imagetools inspect "ghcr.io/${OWNER}/flowguard-${image}:${{ inputs.image_tag }}" > /dev/null \
              || { echo "::error::no published image ghcr.io/${OWNER}/flowguard-${image}:${{ inputs.image_tag }} — this never builds, only an already-published tag can be rolled back to"; exit 1; }
          done
      - name: Deploy ${{ inputs.image_tag }} to the VM
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST_KEY: ${{ secrets.DEPLOY_HOST_KEY }}
          PRODUCTION_ENV_FILE: ${{ secrets.PRODUCTION_ENV_FILE }}
        run: |
          export IMAGE_REGISTRY="ghcr.io/${OWNER}"
          DOMAIN_NAME=$(sed -n "s/^DOMAIN_NAME=//p" <<<"$PRODUCTION_ENV_FILE" | tr -d \''"')
          infra/scripts/deploy.sh "${{ inputs.image_tag }}" "${DOMAIN_NAME:?DOMAIN_NAME missing from PRODUCTION_ENV_FILE}"

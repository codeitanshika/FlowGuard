[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "flowguard-gateway"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.54.0",
    "pydantic-settings>=2.16.2",
    "httpx>=0.28.1",
    "structlog>=26.1.0",
    "redis>=8.1.0",
    "pyjwt>=2.15.1",
    "bcrypt>=5.0.0",
    "opentelemetry-api>=1.45.1",
    "opentelemetry-sdk>=1.45.1",
    "opentelemetry-exporter-otlp-proto-http>=1.45.1",
    "opentelemetry-instrumentation-fastapi>=0.66b1",
    "opentelemetry-instrumentation-httpx>=0.66b1",
    "opentelemetry-instrumentation-redis>=0.66b1",
]

# Dependencies-only manifest — see services/user/pyproject.toml for why
# packages = [].
[tool.setuptools]
packages = []

# Run with: cd services/gateway && python -m pytest
# Separate from the root `python -m pytest` (tests/) — see
# services/payment/tests/conftest.py for why (every service's code lives
# under the same `app` package name).
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flowguard-gateway"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "structlog>=24.1",
    "redis>=5.0",
    "pyjwt>=2.9",
    "bcrypt>=4.2",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-instrumentation-httpx>=0.48b0",
    "opentelemetry-instrumentation-redis>=0.48b0",
]

# Dependencies-only manifest — see services/user/pyproject.toml for why
# packages = [].
[tool.setuptools]
packages = []

# Run with: cd services/gateway && python -m pytest
# Separate from the root `python -m pytest` (tests/) — see
# services/payment/tests/conftest.py for why (every service's code lives
# under the same `app` package name).
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "flowguard-user"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.53.0",
    "sqlalchemy[asyncio]>=2.0.54",
    "asyncpg>=0.31.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "email-validator>=2.3.0",
    "redis>=8.1.0",
    "structlog>=26.1.0",
    "opentelemetry-api>=1.44.0",
    "opentelemetry-sdk>=1.44.0",
    "opentelemetry-exporter-otlp-proto-http>=1.44.0",
    "opentelemetry-instrumentation-fastapi>=0.65b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.65b0",
]

# This pyproject.toml declares dependencies only — app/ is run directly by
# uvicorn, not imported as an installed package. packages = [] tells
# setuptools not to try (and fail) to auto-discover a "flowguard_user"
# package; `pip install .` in the Dockerfile then just resolves and
# installs [project.dependencies].
[tool.setuptools]
packages = []

[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "flowguard-user"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.54.0",
    "sqlalchemy[asyncio]>=2.1.6",
    "asyncpg>=0.32.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.2",
    "email-validator>=2.3.0",
    "redis>=8.1.0",
    "structlog>=26.1.0",
    "opentelemetry-api>=1.45.1",
    "opentelemetry-sdk>=1.45.1",
    "opentelemetry-exporter-otlp-proto-http>=1.45.1",
    "opentelemetry-instrumentation-fastapi>=0.66b1",
    "opentelemetry-instrumentation-sqlalchemy>=0.66b1",
]

# This pyproject.toml declares dependencies only — app/ is run directly by
# uvicorn, not imported as an installed package. packages = [] tells
# setuptools not to try (and fail) to auto-discover a "flowguard_user"
# package; `pip install .` in the Dockerfile then just resolves and
# installs [project.dependencies].
[tool.setuptools]
packages = []

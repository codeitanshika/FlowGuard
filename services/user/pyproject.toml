[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flowguard-user"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "email-validator>=2.1",
    "structlog>=24.1",
]

# This pyproject.toml declares dependencies only — app/ is run directly by
# uvicorn, not imported as an installed package. packages = [] tells
# setuptools not to try (and fail) to auto-discover a "flowguard_user"
# package; `pip install .` in the Dockerfile then just resolves and
# installs [project.dependencies].
[tool.setuptools]
packages = []

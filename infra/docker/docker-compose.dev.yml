# Development-only infrastructure: Postgres + Redis, nothing else.
# Phase 3 replaces/extends this with the full docker-compose.yml at the
# repo root that also containerizes every application service. Until
# then, run this for local Postgres/Redis and run the Python services
# directly (see docs/deployment/setup-guide.md).
#
# Usage: docker compose -f infra/docker/docker-compose.dev.yml up -d

services:
  postgres:
    image: postgres:16.4
    environment:
      POSTGRES_USER: flowguard
      POSTGRES_PASSWORD: flowguard
      POSTGRES_DB: flowguard
    ports:
      - "5432:5432"
    volumes:
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
      - flowguard_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowguard"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  flowguard_pg_data:

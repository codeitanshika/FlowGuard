# Development-only infrastructure: Postgres + Redis + Jaeger, nothing
# else. The full docker-compose.yml at the repo root also containerizes
# every application service — use this one for local Postgres/Redis/
# Jaeger while running the Python services directly (see
# docs/deployment/setup-guide.md, Workflow B).
#
# Usage: docker compose -f infra/docker/docker-compose.dev.yml up -d

services:
  postgres:
    image: postgres:16.4
    environment:
      POSTGRES_USER: flowguard
      POSTGRES_PASSWORD: flowguard
      POSTGRES_DB: flowguard
    ports:
      - "5432:5432"
    volumes:
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
      - flowguard_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowguard"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    ports:
      - "16686:16686" # UI
      - "4317:4317"   # OTLP gRPC (unused — see ADR-0011)
      - "4318:4318"   # OTLP HTTP — host-based services point OTEL_EXPORTER_OTLP_ENDPOINT here

volumes:
  flowguard_pg_data:
